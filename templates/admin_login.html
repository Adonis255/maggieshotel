<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body { background: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; flex-direction: column; }
        form { background: #1a1a1a; padding: 40px; border-radius: 15px; border: 1px solid #d40000; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { width: 100%; padding: 10px; background: #d40000; border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #b30000; }
        h2 { color: #d40000; }
    </style>
</head>
<body>
    <h2>Maggies Admin</h2>
    <form method="POST" action="/admin/login">
        <label>Enter Password</label>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</body>
</html>
